<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mod. B Scanner Pro</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#007bff">
  <script src="https://jsdelivr.net"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #121212; color: #f5f5f5; }
    .container { max-width: 600px; margin: 0 auto; }
    h2 { margin: 0 0 10px 0; text-align: center; font-size: 1.2rem; }
    .top-bar { display: flex; gap: 8px; margin-bottom: 10px; }
    input[type="password"] { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #1e1e1e; color: #fff; font-size: 14px; }
    #btnToggleGrid { padding: 10px 14px; background: #333; color: #fff; border: 1px solid #555; border-radius: 8px; font-size: 14px; cursor: pointer; }
    #gridSettings { display: none; background: #1e1e1e; padding: 12px; border-radius: 8px; border: 1px solid #444; margin-bottom: 10px; font-size: 13px; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .setting-row:last-child { margin-bottom: 0; }
    .setting-row input[type="range"] { width: 55%; }
    .camera-wrapper { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #000; }
    video { width: 100%; display: block; }
    .viewfinder-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
    #mirino { width: 90%; height: 78%; border: 2px solid #00e676; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55); border-radius: 6px; display: grid; box-sizing: border-box; position: relative; }
    .grid-cell { border-right: 1px dashed rgba(0, 230, 118, 0.45); border-bottom: 1px dashed rgba(0, 230, 118, 0.45); }
    .mirino-label { position: absolute; top: -22px; left: 0; background: #00e676; color: #000; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px 4px 0 0; }
    .btn-group { display: flex; gap: 10px; margin: 12px 0; }
    button.action-btn { flex: 1; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
    #btnScatta { background: #007bff; color: white; }
    #btnScatta:disabled { background: #444; color: #888; }
    #btnCopia { background: #28a745; color: white; display: none; }
    #stato { text-align: center; font-size: 14px; color: #ffcc00; margin-bottom: 8px; min-height: 20px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 8px; }
    .online { background: #1b5e20; color: #a5d6a7; }
    .offline { background: #e65100; color: #ffe0b2; }
    pre { background: #1e1e1e; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; border: 1px solid #333; color: #80cbc4; }
  </style>
</head>
<body>

<div class="container">
  <h2>Scanner Distinta Mod. B</h2>

  <div class="top-bar">
    <input type="password" id="apiKeyInput" placeholder="Gemini API Key (opzionale)">
    <button id="btnToggleGrid">Griglia</button>
  </div>

  <div id="gridSettings">
    <div class="setting-row">
      <label>Righe guida: <strong id="valRighe">15</strong></label>
      <input type="range" id="rangeRighe" min="1" max="25" value="15">
    </div>
    <div class="setting-row">
      <label>Colonne guida: <strong id="valColonne">3</strong></label>
      <input type="range" id="rangeColonne" min="1" max="6" value="3">
    </div>
    <div class="setting-row">
      <label>Altezza mirino: <strong id="valAltezza">78%</strong></label>
      <input type="range" id="rangeAltezza" min="30" max="95" value="78">
    </div>
    <div class="setting-row">
      <label>Larghezza mirino: <strong id="valLarghezza">90%</strong></label>
      <input type="range" id="rangeLarghezza" min="50" max="98" value="90">
    </div>
  </div>

  <div class="camera-wrapper">
    <video id="camera" autoplay playsinline></video>
    <div class="viewfinder-overlay">
      <div id="mirino">
        <span class="mirino-label">ALLINEA TABELLA GIOCATORI QUI</span>
      </div>
    </div>
  </div>

  <div class="btn-group">
    <button id="btnScatta" class="action-btn">Scatta ed Estrai JSON</button>
    <button id="btnCopia" class="action-btn">Copia JSON</button>
  </div>

  <div id="stato">Avvio fotocamera...</div>
  <div id="badgeContainer"></div>
  <pre id="outputJson">// Il risultato JSON apparirà qui...</pre>

  <canvas id="canvas" style="display:none;"></canvas>
</div>

<script src="./scannerIbrido.js"></script>
<script src="./app.js"></script>
</body>
</html>
