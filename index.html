<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner Distinta Mod. B</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #121212; color: #f5f5f5; display: flex; flex-direction: column; min-height: 100vh; padding: 10px; gap: 10px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.1rem; }
    button { background: #007bff; color: #fff; border: none; border-radius: 8px; padding: 11px 12px; font-size: 0.92rem; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: #333; }
    button.gallery { background: #6f42c1; }
    button.success { background: #28a745; }
    button.danger-small { background: #dc3545; padding: 4px 10px; font-size: 1rem; border-radius: 6px; }

    #gridSettings { display: none; background: #1e1e1e; padding: 12px; border-radius: 10px; border: 1px solid #333; font-size: 0.85rem; }
    .setting-row { display: flex; flex-direction: column; margin-bottom: 8px; }
    .setting-row label { display: flex; justify-content: space-between; margin-bottom: 4px; }
    input[type="text"], input[type="password"] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; }

    .camera-wrapper {
      position: relative;
      width: 100%;
      height: 62vh;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    #camera {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #mirino {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 88%;
      aspect-ratio: 210 / 297;
      max-height: 94%;
      border: 2px solid #00ff88;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    .mirino-label {
      position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
      background: #00ff88; color: #000; font-size: 0.7rem; font-weight: 700;
      padding: 2px 8px; border-radius: 4px; white-space: nowrap;
    }

    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #btnScatta { grid-column: 1 / -1; padding: 14px; font-size: 1.05rem; }
    #stato { font-size: 0.85rem; color: #ccc; text-align: center; padding: 4px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; }
    .badge.online { background: #1d4ed8; color: #fff; }
    .badge.offline { background: #b45309; color: #fff; }
    pre { background: #1e1e1e; padding: 10px; border-radius: 8px; font-size: 0.8rem; overflow-x: auto; max-height: 200px; border: 1px solid #333; }

    /* Pop-up Verifica e Modifica */
    #modalDuplicati {
      display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
      z-index: 1000; align-items: center; justify-content: center; padding: 10px;
    }
    #modalBox {
      background: #1e1e1e; width: 100%; max-width: 520px; max-height: 92vh;
      border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #444;
    }
    #modalBox.has-errors { border-color: #dc3545; }
    #previewRitaglio {
      width: 100%; max-height: 130px; object-fit: contain; background: #000;
      border-radius: 6px; border: 1px solid #444; display: none;
    }
    #modalList { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; max-height: 48vh; padding-right: 4px; }
    .player-edit-row { display: grid; grid-template-columns: 52px 58px 1fr 34px; gap: 6px; align-items: center; }
    .player-edit-row.is-duplicate input { border-color: #dc3545; background: rgba(220, 53, 69, 0.2); }
    .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  </style>
</head>
<body>
	
  <header>
    <h1>Scanner Distinta Mod. B <span id="app-version" style="font-size: 0.65em; color: #A9A9A9; font-weight: normal;"></span></h1>
    <button type="button" id="btnToggleGrid" class="secondary">Regola Griglia / API</button>
  </header>
  
  <script src="version.js"></script>
	<script>
  // Legge la variabile dal file version.js e la inserisce nell'HTML
  document.getElementById('app-version').textContent = 'v' + APP_VERSION;
	</script>

  <div id="gridSettings">
    <div class="setting-row">
      <label for="apiKeyInput">Gemini API Key (per analisi Online):</label>
      <input type="password" id="apiKeyInput" placeholder="Incolla API Key Gemini (AQ... o AIza...)">
    </div>
    <div class="setting-row" id="zoomCameraRow" style="display:none;">
      <label>Zoom Fotocamera Live: <strong id="valZoomCamera">1.0x</strong></label>
      <input type="range" id="rangeZoomCamera" min="1" max="3" step="0.1" value="1">
    </div>
    <div class="setting-row">
      <label>Righe Titolari: <strong id="valRigheTit">15</strong></label>
      <input type="range" id="rangeRigheTit" min="10" max="15" value="15">
    </div>
    <div class="setting-row">
      <label>Righe Riserve: <strong id="valRigheRis">7</strong></label>
      <input type="range" id="rangeRigheRis" min="0" max="12" value="7">
    </div>
    <div class="setting-row">
      <label>Larghezza N. Maglia: <strong id="valColMaglia">12%</strong></label>
      <input type="range" id="rangeColMaglia" min="8" max="20" value="12">
    </div>
    <div class="setting-row">
      <label>Larghezza Ruolo: <strong id="valColRuolo">9%</strong></label>
      <input type="range" id="rangeColRuolo" min="6" max="20" value="9">
    </div>
    <div class="setting-row">
      <label>Larghezza Mirino A4: <strong id="valAltezza">88%</strong></label>
      <input type="range" id="rangeAltezza" min="50" max="96" value="88">
    </div>
  </div>

  <div class="camera-wrapper">
    <video id="camera" autoplay playsinline muted></video>
    <div id="mirino"></div>
  </div>
  <canvas id="canvas" style="display:none;"></canvas>

  <div class="controls">
    <button type="button" id="btnScatta">Scatta Live</button>
    <button type="button" id="btnFotoNativa" class="secondary">Fotocamera Nativa</button>
    <button type="button" id="btnGalleria" class="gallery">Scegli da Galleria</button>
    <button type="button" id="btnModificaLista" class="secondary" style="grid-column: 1 / -1;">Modifica / Verifica Lista</button>
    <button type="button" id="btnCopia" class="success" style="grid-column: 1 / -1; display:none;">Copia JSON</button>
  </div>

  <!-- Input 1: Apre direttamente la fotocamera di sistema -->
  <input type="file" id="inputFotoNativa" accept="image/*" capture="environment" style="display:none;">
  <!-- Input 2: Apre la Galleria / File Manager senza killare la scheda su Android -->
  <input type="file" id="inputGalleria" accept="image/*" style="display:none;">

  <div id="stato">Avvio fotocamera...</div>
  <div id="badgeContainer" style="text-align:center;"></div>
  <pre id="outputJson">// Il risultato JSON apparirà qui...</pre>

  <!-- Pop-up Verifica e Modifica Giocatori -->
  <div id="modalDuplicati">
    <div id="modalBox">
      <h3 id="modalTitle">Verifica Giocatori</h3>
      <p id="modalMsg" style="font-size:0.82rem; color:#ccc;"></p>
      <img id="previewRitaglio" alt="Anteprima immagine">
      <div id="modalList"></div>
      <div class="modal-actions">
        <button type="button" id="btnAggiungiRiga" class="secondary">+ Riga</button>
        <button type="button" id="btnForzaJson" class="secondary">Chiudi / Forza JSON</button>
        <button type="button" id="btnConfermaCorrezione" class="success">Conferma e Genera JSON</button>
      </div>
    </div>
  </div>

  <script src="scannerIbrido.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        .then((reg) => reg.update())
        .catch(console.error);

      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    }
  </script>
</body>
</html>
