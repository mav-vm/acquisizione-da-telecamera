<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner Distinta Mod. B</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#007bff">
  <script src="https://jsdelivr.net"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #121212; color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; padding: 12px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    h1 { font-size: 1.1rem; color: #4da3ff; }
    button { background: #007bff; color: white; border: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
    button:disabled { background: #555; cursor: not-allowed; }
    button.secondary { background: #333; }
    #gridSettings { display: none; background: #1e1e1e; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #333; }
    .setting-row { display: flex; flex-direction: column; margin-bottom: 8px; font-size: 0.85rem; }
    .setting-row input[type="range"] { width: 100%; margin-top: 4px; }
    .setting-row input[type="password"] { width: 100%; padding: 8px; margin-top: 4px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff; }
    .camera-container { position: relative; width: 100%; height: 55vh; background: #000; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    #mirino { position: absolute; border: 2px solid #00ff88; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55); display: grid; pointer-events: none; }
    .mirino-label { position: absolute; top: -22px; left: 0; background: #00ff88; color: #000; font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 4px 4px 0 0; }
    .grid-cell { border: 1px dashed rgba(0, 255, 136, 0.35); }
    .controls { display: flex; gap: 8px; margin-top: 12px; }
    .controls button { flex: 1; }
    #stato { margin-top: 10px; font-size: 0.9rem; color: #ccc; text-align: center; }
    #badgeContainer { text-align: center; margin-top: 8px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
    .badge.online { background: #1b5e20; color: #a5d6a7; }
    .badge.offline { background: #e65100; color: #ffcc80; }
    pre { background: #1e1e1e; padding: 12px; border-radius: 8px; margin-top: 10px; overflow-x: auto; font-size: 0.85rem; color: #00ff88; border: 1px solid #333; max-height: 30vh; }
    canvas { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>Scanner Distinta Mod. B</h1>
    <button id="btnToggleGrid" class="secondary">Impostazioni / Griglia</button>
  </header>

  <div id="gridSettings">
    <div class="setting-row">
      <label for="apiKeyInput">Gemini API Key (opzionale per modalità Online):</label>
      <input type="password" id="apiKeyInput" placeholder="Incolla qui la tua API Key AIza...">
    </div>
    <div class="setting-row">
      <label>Righe guida: <strong id="valRighe">15</strong></label>
      <input type="range" id="rangeRighe" min="10" max="25" value="15">
    </div>
    <div class="setting-row">
      <label>Colonne guida: <strong id="valColonne">3</strong></label>
      <input type="range" id="rangeColonne" min="1" max="5" value="3">
    </div>
    <div class="setting-row">
      <label>Altezza mirino: <strong id="valAltezza">78%</strong></label>
      <input type="range" id="rangeAltezza" min="30" max="95" value="78">
    </div>
    <div class="setting-row">
      <label>Larghezza mirino: <strong id="valLarghezza">90%</strong></label>
      <input type="range" id="rangeLarghezza" min="50" max="98" value="90">
    </div>
  </div>

  <div class="camera-container">
    <video id="camera" autoplay playsinline></video>
    <div id="mirino"></div>
  </div>

  <div class="controls">
    <button id="btnScatta">Scatta ed Estrai JSON</button>
    <button id="btnCopia" class="secondary" style="display: none;">Copia JSON</button>
  </div>

  <div id="stato">Avvio fotocamera...</div>
  <div id="badgeContainer"></div>
  <pre id="outputJson">// Il risultato JSON apparirà qui...</pre>

  <canvas id="canvas"></canvas>

  <script src="./scannerIbrido.js"></script>
  <script src="./app.js"></script>
</body>
</html>
